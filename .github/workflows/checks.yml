name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Controller, monitor contract, and isolated browser UI
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Frontend status and sorting
        run: node tests/test_booking_model.js
      - name: WCAG tokens in every theme
        run: python check_contrast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-screenshots
          path: build/ui-review/*.png
